[project]
name = "gridfinity-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "authlib>=1.8.0",
    "cadquery>=2.8.0",
    "cqgridfinity>=0.5.7",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pydantic>=2.14.0",
    "python-multipart>=0.0.32",
    "scipy>=1.17.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.4",
    "trimesh>=5.1.1",
    "ultralytics>=8.4.174",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
